name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$SDK_ROOT/licenses/android-sdk-license"
          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
          fi

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: |
          if ! gradle :app:assembleDebug > build.log 2>&1; then
            cat build.log
            ERR_MSG=$(tail -n 90 build.log | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error title=Gradle Build Error::${ERR_MSG}"
            exit 1
          fi
          cat build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/qishui-ad-helper-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qishui-ad-helper-debug-apk
          path: app/build/outputs/apk/debug/qishui-ad-helper-debug.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/qishui-ad-helper-debug.apk \
            --title "畅听自动化助手 v2.0 极简两步连看内核 (Build #${GITHUB_RUN_NUMBER})" \
            --notes "v2.0 重构版（吸收 qishuiAScriptProject 五阶段设计）：1) 局部百分比小区域裁剪 OCR（提速 5~10 倍且物理隔绝底部下载诱导按钮）；2) 确定性两步领取循环（右上角点「领取成功」-> 0.4s 高频盯中间弹窗点「领取奖励」无缝进下一条）；3) 直播间广告关叉后继续领奖励；4) 自动进首广+手动兜底不罢工+支持无限循环刷满当日额度。" || true
