name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK for clarity
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/qishui-ad-helper-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qishui-ad-helper-debug-apk
          path: app/build/outputs/apk/debug/qishui-ad-helper-debug.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "畅听自动化助手 Debug APK (Build #${{ github.run_number }})"
          body: "自动构建产物：下载下方 `qishui-ad-helper-debug.apk` 发送至 Android 11+ 手机即可安装使用。"
          files: app/build/outputs/apk/debug/qishui-ad-helper-debug.apk
